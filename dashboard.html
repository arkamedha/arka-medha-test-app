<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Arka-Medha</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; background-color: #f4f4f9; }
        .container { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .question-list { margin-top: 30px; }
        .question-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; background-color: #fff; border-left: 5px solid #28a745; }
        .badge { background: #007bff; color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Create a New Test</h2>
        
        <!-- Question Form -->
        <div class="form-group">
            <label for="questionType">Select Question Type:</label>
            <select id="questionType" onchange="renderQuestionFields()">
                <option value="mcq">Multiple Choice (MCQ)</option>
                <option value="numerical">Numerical</option>
                <option value="subjective">Subjective</option>
            </select>
        </div>

        <div class="form-group">
            <label for="questionText">Question Statement:</label>
            <textarea id="questionText" rows="3" placeholder="e.g., Calculate the velocity... or Solve the equation..."></textarea>
        </div>

        <!-- Dynamic Fields Container -->
        <div id="dynamicFieldsContainer"></div>

        <button onclick="addQuestion()">Add Question to Test</button>
    </div>

    <!-- Display Added Questions -->
    <div class="container question-list">
        <h2>Questions Added (<span id="questionCount">0</span>)</h2>
        <div id="questionsContainer">
            <!-- Questions will be listed here -->
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
